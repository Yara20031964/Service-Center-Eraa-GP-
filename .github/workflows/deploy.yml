name: Build, publish and deploy to MonsterASP.NET

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: KHDMA.Web/package-lock.json

      - name: Install dependencies
        run: dotnet restore ./KHDMA.API/KHDMA.API.csproj

      - name: Build
        run: dotnet build ./KHDMA.API/KHDMA.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./KHDMA.API/KHDMA.API.csproj --configuration Release --output ./publish

      # The admin SPA is served same-origin from the API's wwwroot (all its calls
      # are relative /api paths), so build it and drop the static bundle into the
      # publish output before WebDeploy ships the folder.
      - name: Build frontend
        working-directory: KHDMA.Web
        run: |
          npm ci
          npm run build

      - name: Copy frontend into publish/wwwroot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./publish/wwwroot | Out-Null
          Copy-Item -Path ./KHDMA.Web/dist/* -Destination ./publish/wwwroot -Recurse -Force

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
